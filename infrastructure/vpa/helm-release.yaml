apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: flux-system
spec:
  interval: 2m
  timeout: 5m
  releaseName: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: "11.1.1"
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 2m
  targetNamespace: kube-system
  install:
    createNamespace: false
    timeout: 2m
    remediation:
      retries: 3
  upgrade:
    timeout: 2m
    remediation:
      remediateLastFailure: True
  values:
