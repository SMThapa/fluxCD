apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 2m
  timeout: 5m
  releaseName: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.2.1"
      sourceRef:
        kind: HelmRepository
        name: monitoring
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 2m
  targetNamespace: monitoring
  install:
    createNamespace: true
    timeout: 2m
    remediation:
      retries: 3
  upgrade:
    timeout: 2m
    remediation:
      remediateLastFailure: true
