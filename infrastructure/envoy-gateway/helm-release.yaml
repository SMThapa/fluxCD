apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 2m
  timeout: 5m
  releaseName: envoy-gateway
  chart:
    spec:
      chart: gateway-helm
      version: "v1.8.1"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 2m
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
    timeout: 2m
    remediation:
      retries: 3
  upgrade:
    timeout: 2m
    remediation:
      remediateLastFailure: true
  values:
