apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 2m
  timeout: 5m
  releaseName: metrics-server
  chart:
    spec:
      chart: metrics-server
      version: "3.13.1"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 2m
  targetNamespace: kube-system
  install:
    createNamespace: false
    timeout: 2m
    remediation:
      retries: 3
  upgrade:
    timeout: 2m
    remediation:
      remediateLastFailure: True
  values:
    args:
      - --kubelet-insecure-tls
